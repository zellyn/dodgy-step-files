[package]
name = "dodgy-step-files"
version = "1.3.2"
edition = "2021"
rust-version = "1.80"
description = "Embedded corpus of known-defective STEP / ISO 10303-21 files for testing CAD kernels"
license = "MIT"
repository = "https://github.com/zellyn/dodgy-step-files"
homepage = "https://zellyn.com/dodgy-step-files/"
readme = "README.md"
keywords = ["step", "cad", "iso-10303", "brep", "corpus"]
categories = ["development-tools::testing"]

[lib]
path = "src/lib.rs"

[dependencies]
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "list"
path = "examples/list.rs"
